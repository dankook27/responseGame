<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반응속도 테스트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Pretendard:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="game.css">
</head>
<body>

  <div class="bg-grid"></div>
  <div class="scanline"></div>

  <div id="app">

    <!-- Header -->
    <header>
      <div class="logo">ResponseGame</div>
      <div class="header-right">
        <div class="stat-pill" id="header-best">
          <span class="pill-label">최고기록</span>
          <span class="pill-val" id="global-best">—</span>
        </div>
      </div>
    </header>

    <!-- Main arena -->
    <main>
      <div id="arena" class="arena state-idle">
        <div class="arena-inner" id="arena-inner">

          <!-- Idle screen -->
          <div class="screen" id="screen-idle">
            <div class="round-indicator">
              <span id="round-dots"></span>
            </div>
            <div class="big-label">클릭해서<br>시작하기</div>
            <div class="hint">화면이 <span class="green-text">초록색</span>으로 바뀌면 클릭하세요</div>
          </div>

          <!-- Waiting screen -->
          <div class="screen" id="screen-wait">
            <div class="pulse-ring"></div>
            <div class="big-label wait-label">기다리세요</div>
            <div class="hint early-warning">⚠ 너무 일찍 클릭하면 실패!</div>
          </div>

          <!-- GO screen -->
          <div class="screen" id="screen-go">
            <div class="go-burst">
              <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/><circle cx="100" cy="100" r="55" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/></svg>
            </div>
            <div class="big-label go-label">지금!</div>
          </div>

          <!-- Too early screen -->
          <div class="screen" id="screen-early">
            <div class="big-label fail-label">너무 빨라요!</div>
            <div class="hint">다시 클릭해서 재시도</div>
          </div>

          <!-- Result screen (single round) -->
          <div class="screen" id="screen-result">
            <div class="round-indicator">
              <span id="result-round-dots"></span>
            </div>
            <div class="result-time" id="result-time">0</div>
            <div class="result-unit">ms</div>
            <div class="result-rating" id="result-rating"></div>
            <div class="hint" id="result-hint">클릭해서 계속</div>
          </div>

          <!-- Final result screen -->
          <div class="screen" id="screen-final">
            <div class="final-title">결과</div>
            <div class="final-avg-wrap">
              <div class="final-avg-label">평균 반응속도</div>
              <div class="final-avg-val" id="final-avg">0</div>
              <div class="final-avg-unit">ms</div>
            </div>
            <div class="final-rating-box" id="final-rating-box"></div>
            <div class="round-list" id="round-list"></div>
            <button class="retry-btn" id="retry-btn">다시 도전</button>
          </div>

        </div>
      </div>

      <!-- Countdown bar -->
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

    </main>

    <!-- Stats panel -->
    <section class="stats-panel">
      <div class="panel-title">세션 통계</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">총 시도</div>
          <div class="stat-val" id="stat-attempts">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">평균</div>
          <div class="stat-val" id="stat-avg">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">최고</div>
          <div class="stat-val accent-green" id="stat-best">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">최저</div>
          <div class="stat-val accent-red" id="stat-worst">—</div>
        </div>
      </div>

      <!-- History chart -->
      <div class="chart-wrap" id="chart-wrap" style="display:none;">
        <div class="chart-label">최근 기록 추이</div>
        <canvas id="history-chart" height="80"></canvas>
      </div>

      <!-- History log -->
      <div class="history-log" id="history-log"></div>
    </section>

  </div>

  <script src="game.js"></script>
</body>
</html>
